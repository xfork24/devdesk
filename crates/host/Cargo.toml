[package]
name = "devdesk-host"
version.workspace = true
edition.workspace = true
[lints]
workspace = true
[dependencies]
devdesk-domain = { path = "../domain" }
devdesk-core = { path = "../core" }
devdesk-adapters = { path = "../adapters", default-features = false }
serde_json.workspace = true
serde.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
mime_guess = "2"
uuid.workspace = true
base64 = "0.22"
url = "2"
[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
devdesk-adapters = { path = "../adapters", default-features = false, features = ["test-fixtures", "fixture-catalog"] }
devdesk-core = { path = "../core", features = ["test-fixtures"] }
tempfile = "3"

[features]
fixture-catalog = ["devdesk-adapters/fixture-catalog"]
