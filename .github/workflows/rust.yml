# Rust kernel gate: format, clippy, tests and the portable config checks.
# web/dist must exist before cargo runs because the host embeds it via RustEmbed.
name: rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/check/check-architecture.sh
      - run: ./scripts/check/check-defaults.sh
      - run: ./scripts/check/check-permissions.sh
