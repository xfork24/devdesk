name: domain release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: domain-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: ./scripts/release/package.sh host
      - uses: actions/upload-artifact@v4
        with:
          name: core-host-${{ matrix.os }}
          path: dist/devdesk-core-host-*.tar.gz*

  domain-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: core-host
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: core-host-ubuntu-latest
          path: dist
      - run: pip install jsonschema
      - run: ./scripts/release/package.sh sdk
      - uses: actions/upload-artifact@v4
        with:
          name: domain-sdk
          path: dist/devdesk-domain-sdk-*.tar.gz*

  # Build independence: the runtime-only archive is built from the SDK artifact and the
  # domain directory alone. The checkout carries nothing else.
  independent-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: domain-sdk
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pip install jsonschema
      - uses: actions/download-artifact@v4
        with:
          name: domain-sdk
          path: sdk-artifact
      - uses: actions/checkout@v5
        with:
          sparse-checkout: plugins/software-development
          persist-credentials: false
      - name: Build the runtime-only archive from the SDK artifact and the domain directory
        run: |
          mkdir sdk-input
          tar -C sdk-input -xzf sdk-artifact/devdesk-domain-sdk-*.tar.gz --strip-components 1
          DEVDESK_SDK="$PWD/sdk-input" \
            python3 plugins/software-development/build.py --runtime-only software-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: independent-runtime-archive
          path: software-development.zip

  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: core-host
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: core-host-ubuntu-latest
          path: dist
      - run: ./scripts/release/package.sh web
      - name: Build the software domain archive
        id: software
        run: |
          ./scripts/release/package.sh software-development
          version=$(python3 plugins/software-development/build.py --version)
          printf 'archive=dist/software-development-%s.zip\n' "$version" >> "$GITHUB_OUTPUT"
      - run: ./web/node_modules/.bin/playwright install --with-deps chromium
      - run: docker pull node@sha256:4660b1ca8b28d6d1906fd644abe34b2ed81d15434d26d845ef0aced307cf4b6f
      - run: node --test tests/entrypoints/domain_delivery_evidence.mjs
      - name: Validate the published archives and version rollback
        run: node tests/entrypoints/domain_release.mjs dist
      - name: Validate hot loading from empty Core with both clients
        env:
          SOFTWARE_ARCHIVE: ${{ steps.software.outputs.archive }}
        run: |
          mkdir -p /tmp/devdesk-release-test
          tar -C /tmp/devdesk-release-test -xzf dist/devdesk-core-host-*.tar.gz
          tar -C /tmp/devdesk-release-test -xzf dist/devdesk-core-web-*.tar.gz
          node tests/entrypoints/domain_packages.mjs /tmp/devdesk-release-test/devdesk-core-host-*/devdesk-host /tmp/devdesk-release-test/devdesk-core-web-* "$SOFTWARE_ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: domain-and-web-core
          path: |
            dist/devdesk-core-web-*.tar.gz*
            ${{ steps.software.outputs.archive }}*
