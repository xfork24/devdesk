# The last successful prerequisite completion starts browser acceptance for the
# exact commit and event. No runner waits for a slower sibling workflow.
name: e2e

on:
  workflow_run:
    workflows: ["rust", "web"]
    types: [completed]

concurrency:
  group: e2e-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.event }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prerequisites:
    # workflow_run can receive fork PR completions. Explicitly reject them
    # before checking out code in the default branch's workflow context.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: gate
        with:
          script: |
            const gate = require('./.github/scripts/e2e-gate.cjs');
            await gate({ github, context, core });

  e2e:
    needs: prerequisites
    if: needs.prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # The Host embeds web/dist at compile time, including in debug builds.
      - run: npm --prefix web run build
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p devdesk-host
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Prepare the selected browser Docker runtime
        run: python3 tests/entrypoints/prepare_browser_runtime.py
      - name: Debug HTTP and browser acceptance
        run: |
          python3 tests/entrypoints/http_contract.py
          python3 tests/entrypoints/template_reset.py target/debug/devdesk-host
          python3 tests/entrypoints/dataset_protocol.py target/debug/devdesk-host
          python3 tests/entrypoints/runtime_preparation.py target/debug/devdesk-host
          npm --prefix web run test:e2e
      - run: cargo build --release --locked -p devdesk-host
      - name: Release standalone HTTP and browser acceptance
        env:
          DEVDESK_E2E_PROFILE: release
        run: |
          python3 tests/entrypoints/http_contract.py target/release/devdesk-host --standalone
          python3 tests/entrypoints/template_reset.py target/release/devdesk-host
          python3 tests/entrypoints/dataset_protocol.py target/release/devdesk-host
          python3 tests/entrypoints/runtime_preparation.py target/release/devdesk-host
          npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-${{ github.event.workflow_run.head_sha }}
          path: web/test-results/
          retention-days: 7
